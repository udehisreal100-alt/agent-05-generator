name: Agent 05 - Digital Asset Generator

on:
  schedule:
    - cron: '0 0 */3 * *' # Automated run every 3 days
  workflow_dispatch: # Allows manual trigger button

jobs:
  run-digital-asset-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Execute Agent 05
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python agent_05.py
